name: Setup ReSukiSU
description: Download and configure ReSukiSU with version tracking
inputs:
  use_latest_commits:
    description: 'Use the latest commit on the branch instead of the pinned commit'
    required: false
    default: true

runs:
  using: composite
  steps:
    - name: Download ReSukiSU
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        RE_SUKISU_BRANCH="main"

        if [ "${{ inputs.use_latest_commits }}" = "true" ]; then
          echo "Using latest ReSukiSU from branch: $RE_SUKISU_BRANCH"
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s "$RE_SUKISU_BRANCH"
        else
          COMMITS_JSON="${{ github.workspace }}/.github/config/commits.json"
          RE_SUKISU_COMMIT=$(jq -er '.resukisu.main // .kernelsu.dev' "$COMMITS_JSON")
          echo "Using pinned ReSukiSU commit: $RE_SUKISU_COMMIT"
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s "$RE_SUKISU_COMMIT"
        fi

        cd KernelSU
        KSU_GIT_VERSION=$(/usr/bin/git rev-list --count HEAD)
        KSU_VERSION=$((30000 + KSU_GIT_VERSION + 700))
        KSU_GIT_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo "v4.1.0")"
        KSU_COMMIT="$(git rev-parse --short=8 HEAD 2>/dev/null || echo unknown)"

        echo "ReSukiSU version code: $KSU_VERSION"
        echo "ReSukiSU tag: $KSU_GIT_TAG"
        echo "ReSukiSU commit: $KSU_COMMIT"

    - name: Extract ReSukiSU Version Info
      id: ksu-version
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/KernelSU
      run: |
        set -euo pipefail
        KSU_GIT_VERSION=$(git rev-list --count HEAD 2>/dev/null)
        KSU_GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v4.1.0")
        KSU_COMMIT=$(git rev-parse --short HEAD 2>/dev/null)
        KSU_VERSION=$((30000 + KSU_GIT_VERSION + 700))

        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> "$GITHUB_ENV"
        echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"
        echo "KSU_COMMIT=$KSU_COMMIT" >> "$GITHUB_ENV"
        echo "KSU_MANAGER=ReSukiSU" >> "$GITHUB_ENV"

    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU=y
          CONFIG_KSU_MULTI_MANAGER_SUPPORT=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y